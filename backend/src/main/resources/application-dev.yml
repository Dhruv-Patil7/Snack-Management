spring:
  datasource:
    url: jdbc:h2:mem:snackdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false # disable flyway in dev mode to rely on Hibernate schema generation for H2

server:
  port: 8080

app:
  jwt:
    secret: default-dev-secret-key-change-in-production-must-be-at-least-256-bits-long
    login-expiration-ms: 28800000   # 8 hours
    qr-expiration-ms: 30000         # 30 seconds

  upload:
    photo-dir: ./uploads/photos
    max-photo-width: 512
    max-photo-height: 512

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost
